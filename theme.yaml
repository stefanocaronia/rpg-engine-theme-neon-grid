# Neon Grid, a theme of the rpg-engine dashboard: cyan and magenta light on a midnight grid, a pale terminal by day, wide geometric titles.
name: Neon Grid
version: 1.1.1
engine: "0.22"
fonts:
  - {family: Orbitron, file: fonts/orbitron/Orbitron.ttf, weight: 400 900, license: fonts/orbitron/OFL.txt}
  - {family: Exo 2, file: fonts/exo-2/Exo2.ttf, weight: 100 900, license: fonts/exo-2/OFL.txt}
text-font: Exo 2
title-font: Orbitron
story-font: Exo 2
number-font: title
corners: 10
titles: {case: capitals, spacing: 0.04}
cards: {inner-line: none, ornament: images/bracket.svg, corner: cut, texture: {picture: images/grain.svg}}
buttons: {shape: cut}
tabs: {shape: cut}
shadows: glow
papers: {documents: "#eef1f7", maps: "#e8edf3"}
portraits: {shape: cut, frame: thin}
light:
  paper: "#eef0fa"
  panel: "#fbfbff"
  rule: "#cfd3ec"
  ink: "#12102b"
  muted: "#4f5275"
  accent: "#0a6580"
  gold: "#a8126a"
  on-gold: "#ffffff"
  ally: "#156e44"
  low: "#b13119"
  card-edge: "#b4bbe6"
  bar-edge: "#a8126a"
  page-texture: {picture: images/grid-light.svg, fit: tile}
  head-picture: {picture: images/horizon-light.svg, fit: cover}
  card-grain: "#b7bde6"
  shadow: "#6b5fd8"
  portrait-frame: "#0a6580"
dark:
  paper: "#07061a"
  panel: "#110d2a"
  rule: "#2c2456"
  ink: "#eaf2ff"
  muted: "#a9b2d6"
  accent: "#35e3ff"
  gold: "#ff3fa4"
  on-gold: "#0a0618"
  ally: "#5cf2a0"
  low: "#ff7a4d"
  card-edge: "#3a2f78"
  title-glow: "#35e3ff"
  bar-edge: "#ff3fa4"
  page-texture: {picture: images/grid-dark.svg, fit: tile}
  head-picture: {picture: images/horizon-dark.svg, fit: cover}
  card-grain: "#4b3fa0"
  shadow: "#35e3ff"
  portrait-frame: "#35e3ff"
  bar-texture: {picture: images/scanlines.svg, fit: tile}
